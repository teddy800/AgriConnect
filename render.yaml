# Render Blueprint for AgriConnect
# This file defines all services needed for production deployment

services:
  # Backend API Service
  - type: web
    name: agriconnect-backend
    env: node
    region: oregon
    plan: starter
    branch: main
    buildCommand: cd backend && npm install
    startCommand: cd backend && node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: DB_HOST
        fromDatabase:
          name: agriconnect-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: agriconnect-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: agriconnect-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: agriconnect-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: agriconnect-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGIN
        sync: false
      - key: REDIS_ENABLED
        value: false
      - key: ELASTICSEARCH_ENABLED
        value: false
      - key: WEBSOCKET_ENABLED
        value: true
      - key: MAX_FILE_SIZE
        value: 5242880
      - key: RATE_LIMIT_WINDOW_MS
        value: 900000
      - key: RATE_LIMIT_MAX_REQUESTS
        value: 100
    healthCheckPath: /api/health
    autoDeploy: true

  # Frontend Service
  - type: web
    name: agriconnect-frontend
    env: static
    branch: main
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-XSS-Protection
        value: 1; mode=block
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false
    autoDeploy: true

databases:
  # PostgreSQL Database
  - name: agriconnect-db
    databaseName: agriconnect_prod
    user: agriconnect_user
    plan: starter
    region: oregon
    ipAllowList: []
